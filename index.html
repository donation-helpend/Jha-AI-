<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JHA AI - Personal AI Creator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070707;
  color:#fff;
  min-height:100vh;
}

button,textarea{font:inherit}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:18px;
}

header{
  text-align:center;
  padding:25px 0 20px;
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{color:#9b5cff}

.tagline{
  color:#999;
  margin-top:7px;
  font-size:14px;
}

.main{
  background:#101010;
  border:1px solid #252525;
  border-radius:22px;
  padding:18px;
}

.label{
  display:block;
  margin-bottom:9px;
  font-size:14px;
  color:#bbb;
}

textarea{
  width:100%;
  min-height:155px;
  resize:vertical;
  background:#080808;
  color:#fff;
  border:1px solid #292929;
  border-radius:15px;
  padding:16px;
  outline:none;
}

textarea:focus{border-color:#8b5cf6}
textarea::placeholder{color:#666}

.create{
  width:100%;
  margin-top:14px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:linear-gradient(90deg,#6d28d9,#9b5cff);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.create:disabled{
  opacity:.6;
  cursor:wait;
}

.quick{margin-top:22px}

.quick-title{
  font-size:14px;
  color:#aaa;
  margin-bottom:10px;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.mode{
  background:#171717;
  color:#ddd;
  border:1px solid #292929;
  border-radius:11px;
  padding:12px 7px;
  cursor:pointer;
}

.mode.active{
  background:#7c3aed;
  border-color:#8b5cf6;
  color:white;
}

#status{
  display:none;
  margin-top:18px;
  padding:12px;
  border-radius:10px;
  background:#171717;
  color:#aaa;
  text-align:center;
}

.results{
  margin-top:22px;
  display:none;
}

.result-card{
  background:#101010;
  border:1px solid #292929;
  border-radius:16px;
  margin-bottom:13px;
  overflow:hidden;
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px 15px;
  border-bottom:1px solid #252525;
}

.card-head strong{font-size:15px}

.copy{
  background:#222;
  color:#fff;
  border:1px solid #3a3a3a;
  border-radius:8px;
  padding:7px 10px;
  cursor:pointer;
}

.card-body{
  padding:15px;
  white-space:pre-wrap;
  line-height:1.6;
  color:#ddd;
  font-size:14px;
}

.notice{
  margin-top:20px;
  background:#111;
  border:1px solid #252525;
  border-radius:15px;
  padding:15px;
  color:#999;
  font-size:13px;
  line-height:1.6;
}

footer{
  text-align:center;
  color:#555;
  font-size:12px;
  padding:25px 0 10px;
}

@media(max-width:700px){
  .buttons{grid-template-columns:repeat(2,1fr)}
  .logo{font-size:34px}
  .app{padding:12px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">JHA <span>AI</span></div>
  <div class="tagline">Your Personal AI Creator</div>
</header>

<section class="main">

<label class="label">Aap kya banana chahte ho?</label>

<textarea id="prompt" placeholder="Example:

Ek 1 minute ki horror story banao jisme ek ladka purane jungle mein kho jata hai. Story, scenes, image prompts, video prompts aur social media package do."></textarea>

<button id="createBtn" class="create" onclick="createContent()">
  ✨ CREATE WITH JHA AI
</button>

<div class="quick">

<div class="quick-title">Quick tools</div>

<div class="buttons">

<button class="mode active" onclick="setMode(this,'All-in-One')">🤖 All-in-One</button>
<button class="mode" onclick="setMode(this,'Story')">📖 Story</button>
<button class="mode" onclick="setMode(this,'Image')">🖼️ Text → Image</button>
<button class="mode" onclick="setMode(this,'Video')">🎬 Text → Video</button>
<button class="mode" onclick="setMode(this,'Scenes')">🎞️ Scenes</button>
<button class="mode" onclick="setMode(this,'Instagram')">📸 Instagram</button>
<button class="mode" onclick="setMode(this,'YouTube')">▶️ YouTube</button>
<button class="mode" onclick="setMode(this,'Facebook')">📘 Facebook</button>
<button class="mode" onclick="setMode(this,'Thumbnail')">🖼️ Thumbnail</button>
<button class="mode" onclick="setMode(this,'SEO')">🔍 SEO</button>
<button class="mode" onclick="setMode(this,'Script')">🎙️ Voice Script</button>
<button class="mode" onclick="setMode(this,'Writer')">✍️ Writer</button>

</div>
</div>

<div id="status"></div>

</section>

<section class="results" id="results"></section>

<div class="notice">
  <b>JHA AI Personal Creator</b><br>
  AI-powered personal content creator. Text generation is connected through the secure JHA AI backend.
</div>

<footer>
  JHA AI • Personal Creator
</footer>

</div>

<script>

const API_URL =
"https://jha-ai-backend.jhaa50183.workers.dev/";

let currentMode = "All-in-One";

function setMode(button, mode){

  currentMode = mode;

  document.querySelectorAll(".mode").forEach(function(btn){
    btn.classList.remove("active");
  });

  button.classList.add("active");
}

function addCard(title, text){

  const results = document.getElementById("results");

  const card = document.createElement("div");
  card.className = "result-card";

  const head = document.createElement("div");
  head.className = "card-head";

  const titleElement = document.createElement("strong");
  titleElement.textContent = title;

  const copy = document.createElement("button");
  copy.className = "copy";
  copy.textContent = "📋 Copy";

  copy.onclick = async function(){

    try{

      await navigator.clipboard.writeText(text);

      copy.textContent = "✅ Copied";

      setTimeout(function(){
        copy.textContent = "📋 Copy";
      },1500);

    }catch(error){

      copy.textContent = "❌ Copy failed";

      setTimeout(function(){
        copy.textContent = "📋 Copy";
      },1500);

    }
  };

  head.appendChild(titleElement);
  head.appendChild(copy);

  const body = document.createElement("div");
  body.className = "card-body";
  body.textContent = text;

  card.appendChild(head);
  card.appendChild(body);

  results.appendChild(card);
}

function buildInstruction(prompt){

  const instructions = {

    "All-in-One": `
Create a complete content package for the user's request.

Include only sections that are relevant, but when suitable include:
1. Main content/story
2. Scene-by-scene breakdown
3. Consistent image prompts
4. Consistent video prompts
5. Voice-over script
6. Instagram package
7. YouTube package
8. Facebook package
9. Thumbnail prompt
10. SEO package

Make everything specific to the user's actual idea.
Do not use generic filler.
`,

    "Story": `
Write the complete story requested by the user.
Make it engaging, natural and properly structured.
If a duration is mentioned, keep the story suitable for that duration.
`,

    "Image": `
Create a detailed production-ready TEXT-TO-IMAGE prompt based exactly on the user's request.
Describe subject, environment, composition, lighting, camera, mood, realism/style and aspect ratio.
Do not claim an image was generated.
`,

    "Video": `
Create a detailed production-ready TEXT-TO-VIDEO prompt based exactly on the user's request.
Include subject movement, camera movement, environment, lighting, mood, continuity and aspect ratio.
Do not claim a video was generated.
`,

    "Scenes": `
Break the user's actual idea into clear scenes.
For every scene maintain character appearance, clothing, location and visual continuity.
`,

    "Instagram": `
Create a complete Instagram package based on the user's request:
Reel idea, hook, caption, CTA, hashtags and SEO keywords.
`,

    "YouTube": `
Create a complete YouTube package:
Title, hook, script/content idea, description, tags, hashtags, thumbnail concept and SEO keywords.
`,

    "Facebook": `
Create a complete Facebook package:
Post/reel idea, hook, caption, CTA and hashtags.
`,

    "Thumbnail": `
Create a detailed thumbnail-generation prompt based exactly on the user's request.
Include composition, subject, expression, lighting, background, text placement and 16:9 ratio.
Do not claim a thumbnail was generated.
`,

    "SEO": `
Create an SEO package for the user's request:
Primary keyword, SEO title, meta description, secondary keywords, search phrases and hashtags.
`,

    "Script": `
Write a natural voice-over script based exactly on the user's request.
Include hook, main narration, transitions, ending and CTA when appropriate.
`,

    "Writer": `
Write polished, original reader-friendly content based exactly on the user's request.
Use clear headings and natural language.
`
  };

  return instructions[currentMode] || instructions["All-in-One"];
}

async function createContent(){

  const prompt =
    document.getElementById("prompt").value.trim();

  const results =
    document.getElementById("results");

  const status =
    document.getElementById("status");

  const createBtn =
    document.getElementById("createBtn");

  if(!prompt){

    alert("Pehle apna idea ya kaam likho bro.");
    return;
  }

  results.innerHTML = "";
  results.style.display = "block";

  status.style.display = "block";
  status.textContent = "🤖 JHA AI aapka content bana raha hai...";

  createBtn.disabled = true;

  const finalPrompt = `
You are JHA AI — a personal AI creator.

Selected tool:
${currentMode}

User request:
${prompt}

Task instructions:
${buildInstruction(prompt)}

IMPORTANT RULES:

- Understand the user's exact request.
- Do not replace the request with a generic template.
- Give useful finished content.
- If the user writes Hindi/Hinglish, answer in Hindi/Hinglish.
- If the user asks for English, answer in English.
- Keep characters and scenes consistent when creating visual prompts.
- Do not claim that an image or video was actually generated.
- For image/video requests, provide production-ready prompts.
- Use clear headings.
`;

  try{

    const response = await fetch(API_URL,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        prompt:finalPrompt
      })

    });

    let data;

    try{
      data = await response.json();
    }catch(error){
      throw new Error("Backend ne valid response nahi diya.");
    }

    if(!response.ok || !data.ok){

      throw new Error(
        data.error ||
        data.details ||
        "JHA AI request failed."
      );
    }

    status.style.display = "none";

    addCard(
      "🤖 JHA AI — " + currentMode,
      data.response || "AI ne empty response diya."
    );

    results.scrollIntoView({
      behavior:"smooth"
    });

  }catch(error){

    status.textContent =
      "❌ JHA AI connection error";

    addCard(
      "⚠️ ERROR",
      "JHA AI response nahi de paya.\n\n" +
      "Error:\n" +
      error.message
    );

  }finally{

    createBtn.disabled = false;
  }
}

</script>

</body>
  </html>
